<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Мираж Anime</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #08090d;
    color: #fff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

/* =========================
   ШАПКА
========================= */

header {
    padding: 22px 16px 18px;

    display: flex;
    flex-direction: column;
    align-items: center;

    border-bottom: 1px solid rgba(255,255,255,0.07);

    background: rgba(8,9,13,0.96);
}

.logo {
    font-size: 25px;
    font-weight: 700;
    letter-spacing: 1px;

    background: linear-gradient(
        110deg,
        #707070,
        #eeeeee,
        #999999,
        #ffffff,
        #707070
    );

    background-size: 300% 100%;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation: shine 4s linear infinite;

    margin-bottom: 15px;
}

@keyframes shine {

    0% {
        background-position: 300% 0;
    }

    100% {
        background-position: -300% 0;
    }

}

/* =========================
   КНОПКА ПОИСКА
========================= */

.search-button {

    width: 190px;
    height: 38px;

    border-radius: 20px;

    border: 1px solid rgba(255,255,255,0.16);

    background: rgba(255,255,255,0.05);

    color: #d5d5d5;

    font-size: 14px;

    cursor: pointer;

    transition: all 0.25s ease;
}

.search-button:hover {

    background: rgba(255,255,255,0.1);

    border-color: rgba(255,255,255,0.3);

    color: #fff;

}

.search-button:active {
    transform: scale(0.97);
}

/* =========================
   ОСНОВНОЙ КОНТЕНТ
========================= */

main {
    padding: 22px 15px 90px;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

/* =========================
   ЗАГОЛОВОК
========================= */

.section-title {

    font-size: 18px;

    font-weight: 600;

    margin-bottom: 16px;

}

/* =========================
   КАРТОЧКИ
========================= */

.anime-grid {

    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 11px;

    max-width: 420px;

    margin: 0 auto;

}

.anime-card {

    position: relative;

    aspect-ratio: 2 / 3;

    border-radius: 9px;

    background:
        linear-gradient(
            145deg,
            #15171d,
            #0d0e13
        );

    border: 1px solid rgba(255,255,255,0.07);

    overflow: hidden;

    transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;

}

.anime-card:hover {

    transform: translateY(-3px);

    border-color: rgba(255,255,255,0.18);

    box-shadow:
        0 7px 20px rgba(0,0,0,0.45);

}

/* =========================
   ПУСТЫЕ СТРАНИЦЫ
========================= */

.empty-page {

    min-height: calc(100vh - 190px);

    display: flex;

    align-items: center;
    justify-content: center;

    color: #555;

    font-size: 14px;

}

/* =========================
   НИЖНЯЯ НАВИГАЦИЯ
========================= */

.bottom-nav {

    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    height: 65px;

    display: flex;

    justify-content: center;
    align-items: center;

    background: rgba(10,11,16,0.97);

    backdrop-filter: blur(12px);

    border-top: 1px solid rgba(255,255,255,0.07);

    z-index: 100;

}

.nav-container {

    width: 100%;

    max-width: 430px;

    display: flex;

    justify-content: space-around;

}

.nav-button {

    border: none;

    background: transparent;

    color: #707070;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 3px;

    font-size: 10px;

    cursor: pointer;

    transition: color 0.25s ease;

}

.nav-icon {

    font-size: 20px;

}

.nav-button.active {

    color: #fff;

}

/* =========================
   ТЕЛЕФОН
========================= */

@media (max-width: 360px) {

    header {
        padding-top: 19px;
        padding-bottom: 16px;
    }

    .logo {
        font-size: 23px;
        margin-bottom: 13px;
    }

    .search-button {
        width: 175px;
        height: 36px;
        font-size: 13px;
    }

    main {
        padding-left: 11px;
        padding-right: 11px;
    }

    .anime-grid {
        gap: 9px;
        max-width: 380px;
    }

    .section-title {
        font-size: 17px;
    }

}

</style>
</head>

<body>


<!-- =========================
     ШАПКА
========================= -->

<header>

    <div class="logo">
        Мираж Anime
    </div>

    <button class="search-button" onclick="searchAnime()">
        🔍 Искать аниме
    </button>

</header>


<!-- =========================
     СТРАНИЦЫ
========================= -->

<main>


    <!-- ГЛАВНАЯ -->

    <section id="home" class="page active">

        <div class="section-title">
            Аниме
        </div>

        <div class="anime-grid">

            <div class="anime-card"></div>

            <div class="anime-card"></div>

        </div>

    </section>


    <!-- ИЗБРАННОЕ -->

    <section id="favorites" class="page">

        <div class="empty-page">
            Здесь пока ничего нет
        </div>

    </section>


    <!-- ПРОФИЛЬ -->

    <section id="profile" class="page">

        <div class="empty-page">
            Профиль пока пуст
        </div>

    </section>


</main>


<!-- =========================
     НИЖНЯЯ НАВИГАЦИЯ
========================= -->

<nav class="bottom-nav">

    <div class="nav-container">

        <button
            class="nav-button active"
            onclick="openPage('home', this)"
        >
            <span class="nav-icon">⌂</span>
            <span>Главная</span>
        </button>


        <button
            class="nav-button"
            onclick="openPage('favorites', this)"
        >
            <span class="nav-icon">♡</span>
            <span>Избранное</span>
        </button>


        <button
            class="nav-button"
            onclick="openPage('profile', this)"
        >
            <span class="nav-icon">♙</span>
            <span>Профиль</span>
        </button>

    </div>

</nav>


<script>

/* =========================
   ПЕРЕКЛЮЧЕНИЕ СТРАНИЦ
========================= */

function openPage(pageId, button) {

    document.querySelectorAll('.page').forEach(page => {
        page.classList.remove('active');
    });

    document.getElementById(pageId).classList.add('active');

    document.querySelectorAll('.nav-button').forEach(btn => {
        btn.classList.remove('active');
    });

    button.classList.add('active');

    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });

}


/* =========================
   ПОИСК
========================= */

function searchAnime() {

    alert("Поиск аниме будет добавлен позже.");

}

</script>

</body>
</html>
